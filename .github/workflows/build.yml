name: Build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Build args for tooling.build build"
        required: false
        type: string
      force:
        description: "Force rebuild selected targets"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "47 7 * * *"
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "tooling/build/**"
      - "tests/build/**"
      - "pyproject.toml"
      - "uv.lock"
      - "!.github/**"

env:
  TZ: ${{ vars.TZ || 'Asia/Shanghai' }}
  GITHUB_TOKEN: ${{ github.token }}
  PLATFORM: ${{ vars.PLATFORM || 'linux/amd64' }}
  TARGETS: ${{ vars.TARGETS || '' }}
  BUILD_REPORT_FILE: .tmp/build-report.json
  # Non-sensitive identifiers, so they live in Variables rather than Secrets:
  # GitHub masks a secret's value everywhere it appears, while a variable is
  # left verbatim. Empty when unset, which is what the `if:` on the Infisical
  # step keys off. Read through `env:` so the step's `if:` and the action's
  # `with:` share one definition rather than spelling `vars.*` twice.
  INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
  INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'dev' }}
  INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
  INFISICAL_SECRET_PATH: ${{ vars.INFISICAL_SECRET_PATH || '/project/containerization' }}
  INFISICAL_RECURSIVE: ${{ vars.INFISICAL_RECURSIVE || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # The version branch holds mutable build state and may not exist yet on a
      # fresh remote, so create and push an empty state file when it is missing
      # instead of failing the whole run in the checkout step.
      - name: Checkout version
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote "$remote" 'refs/heads/version' | grep -q 'refs/heads/version$'; then
            git clone --depth 1 --branch version "$remote" version
            exit 0
          fi

          echo "version branch missing; initializing empty state"
          mkdir -p version
          git -C version init -b version
          git -C version remote add origin "$remote"
          printf '{}\n' > version/version.yml
          git -C version add version.yml
          git -C version -c user.name='github-actions[bot]' \
            -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore: initialize version state'
          git -C version push -u origin version

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main
          ref: main
          submodules: true

      # Optional: skipped when no Infisical identity is configured, so a fork
      # can inject every credential through repo secrets instead. Requires an
      # OIDC machine identity bound to repo:ignimutos/Containerization. The
      # action defaults to export-type=env, so fetched secrets become job-level
      # environment variables for later steps.
      - name: Inject secrets from Infisical
        if: env.INFISICAL_IDENTITY_ID != '' && env.INFISICAL_PROJECT_ID != ''
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          project-id: ${{ env.INFISICAL_PROJECT_ID }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}
          recursive: ${{ env.INFISICAL_RECURSIVE }}

      # Repo secrets win over Infisical: this step runs after the action and
      # writes the non-empty repo secrets to GITHUB_ENV, so later steps see the
      # repo value; when the action was skipped this is the fallback that injects
      # them at all. Add a name here to make it overridable.
      - name: Overlay repo secrets
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for name in DOCKERHUB_USER DOCKERHUB_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Sync Python dependencies
        working-directory: main
        run: uv sync --frozen

      - name: Run Python tests
        working-directory: main
        run: uv run pytest tests/build -q

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY || 'docker.io' }}
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          # Reusing the runner's cached binfmt image fails to restore and only
          # logs a warning before falling back to `docker pull`. Pull directly.
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get changed files
        if: github.event_name == 'push'
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          path: main
          files: |
            images/**
            tooling/build/**
            tests/build/**
            pyproject.toml
            uv.lock

      - name: Build selected targets
        working-directory: main
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          INPUT_TARGETS: ${{ github.event.inputs.targets || '' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          mkdir -p .tmp

          args=()
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            raw_targets="$INPUT_TARGETS"
          else
            raw_targets="$TARGETS"
          fi

          if [[ -n "$raw_targets" ]]; then
            while IFS= read -r token; do
              [[ -n "$token" ]] || continue
              args+=("$token")
            done < <(RAW_TARGETS="$raw_targets" python -c 'import os, re; raw = os.environ.get("RAW_TARGETS", ""); print(*filter(None, re.split(r"[\s,]+", raw.strip())), sep="\n")')
          elif [[ "${{ github.event_name }}" == 'push' ]]; then
            for file in $CHANGED_FILES; do
              [[ -n "$file" ]] || continue
              args+=(--changed-file "$file")
            done
          fi

          if [[ "$INPUT_FORCE" == 'true' ]]; then
            args+=(--force)
          fi

          uv run python -m tooling.build build --repo-root . --registry-user "$DOCKERHUB_USER" --state-file ../version/version.yml --push --platform "$PLATFORM" --report-file "$BUILD_REPORT_FILE" "${args[@]}"

      - name: Sync Docker Hub READMEs
        working-directory: main
        run: |
          uv run python -m tooling.build sync-readmes --report-file "$BUILD_REPORT_FILE" --repo-root . --dockerhub-namespace "$DOCKERHUB_USER" --dockerhub-username "$DOCKERHUB_USER" --dockerhub-password "$DOCKERHUB_TOKEN"

      - name: Send Telegram success summary
        if: success() && hashFiles('main/.tmp/build-report.json') != ''
        working-directory: main
        run: |
          uv run python -m tooling.build send-telegram --report-file "$BUILD_REPORT_FILE" --bot-token "$TELEGRAM_BOT_TOKEN" --chat-id "$TELEGRAM_CHAT_ID" --template success

      - name: Send Telegram failure summary
        if: failure() && hashFiles('main/.tmp/build-report.json') != ''
        working-directory: main
        run: |
          uv run python -m tooling.build send-telegram --report-file "$BUILD_REPORT_FILE" --bot-token "$TELEGRAM_BOT_TOKEN" --chat-id "$TELEGRAM_CHAT_ID" --template failure

      - name: Write build summary
        if: always() && hashFiles('main/.tmp/build-report.json') != ''
        working-directory: main
        run: |
          uv run python -m tooling.build write-summary --report-file "$BUILD_REPORT_FILE" --github-step-summary "$GITHUB_STEP_SUMMARY" --format markdown

      - name: Update version branch state
        working-directory: version
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.yml
          git commit -m "chore: bump version"
          git push origin version
